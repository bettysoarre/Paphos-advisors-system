---
id: SCH-NOT-004
title: "Cases Database — Notion Schema"
database_name: Cases
notion_database_id: TBD
schema_version: 1
status: draft
created: 2026-04-14
updated: 2026-04-14
owner: "lead-advisor"
related_taxonomies:
  - TAX-ICP-001   # ICP Segments
  - TAX-TAG-001   # Tag Registry
---

description: >
  Tracks all client advisory cases from initial contact through closure.
  Each record represents one engagement with one client.

fields:

  - name: Case ID
    notion_type: title
    required: true
    description: Unique case identifier. Format — CASE-[NNN] (e.g. CASE-001)

  - name: Client Name
    notion_type: relation
    required: true
    description: Link to the client record in the Contacts database.
    relation_target: Contacts Database

  - name: Status
    notion_type: select
    required: true
    allowed_values:
      - enquiry
      - assessment
      - proposal-sent
      - active
      - on-hold
      - closed-won
      - closed-lost

  - name: ICP Segment
    notion_type: select
    required: false
    description: Which ICP segment this client belongs to.
    allowed_values:
      - uk-national
      - eu-national
      - non-eu-digital-nomad
      - entrepreneur-company-formation
      - hni-permanent-residency
      - family-relocating-with-children
    taxonomy_ref: TAX-ICP-001

  - name: Processes Required
    notion_type: multi_select
    required: false
    description: Which processes this case involves.
    allowed_values:
      - yellow-slip-meu1
      - pink-slip-meu3
      - category-f-permit
      - digital-nomad-visa
      - permanent-residency-fast-track
      - 60-day-rule-tax-residency
      - non-dom-status
      - personal-tax-return
      - renting-a-property
      - buying-property
      - he-company-formation
      - gesy-registration
      - bank-account-opening
      - driving-licence-exchange
      - vehicle-import

  - name: Assigned Advisor
    notion_type: person
    required: true
    description: Team member responsible for this case.

  - name: Date Opened
    notion_type: date
    required: true
    description: Date the case was created.

  - name: Date Closed
    notion_type: date
    required: false
    description: Date the case was closed. Leave blank if still active.

  - name: Priority
    notion_type: select
    required: false
    allowed_values:
      - high
      - normal
      - low

  - name: Partners Referred To
    notion_type: relation
    required: false
    description: Partners referred to for this case.
    relation_target: Partners Database

  - name: Source
    notion_type: select
    required: false
    description: How the client found us.
    allowed_values:
      - organic-search
      - referral-partner
      - referral-client
      - social-media
      - direct-word-of-mouth
      - other

  - name: Case Notes
    notion_type: rich_text
    required: false
    description: High-level case summary and key decisions. Detailed notes go in sub-pages.

  - name: Next Action
    notion_type: rich_text
    required: false
    description: The single next action required on this case.

  - name: Next Action Date
    notion_type: date
    required: false
    description: When the next action is due.

  - name: Fee (€)
    notion_type: number
    required: false
    description: Total agreed fee for this case.

  - name: Tags
    notion_type: multi_select
    required: false
    description: Additional tags for filtering. Use canonical tags from tag-registry.yaml.
    taxonomy_ref: TAX-TAG-001

rules:
  - "Case ID format: CASE-[NNN]. Assign sequentially from id-registry.md CASE sequence."
  - "Client Name relation must always be populated — no orphaned cases."
  - "Date Closed must be populated when Status = closed-won or closed-lost."
  - "ICP Segment values must match TAX-ICP-001 exactly (kebab-case)."
