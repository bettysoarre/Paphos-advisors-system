---
id: SCH-NOT-003
title: "Content Pipeline Database — Notion Schema"
database_name: Content Pipeline
notion_database_id: b8429a09-8cef-4fdf-aafc-82b990db0689
schema_version: 1
status: active
created: 2026-04-14
updated: 2026-04-15
owner: "lead-advisor"
related_taxonomies:
  - TAX-CNT-001   # Content Categories
  - TAX-ICP-001   # ICP Segments
  - TAX-TAG-001   # Tag Registry
---

description: >
  Master database tracking all content from brief through to publication.
  Each record represents one discrete piece of content.

fields:

  - name: Title
    notion_type: title
    required: true
    description: Working title of the content piece. May differ from the final published title.

  - name: Content ID
    notion_type: rich_text
    required: true
    description: >
      Unique identifier for this content piece.
      Format: CNT-[TYPE CODE]-[3-digit sequence] e.g. CNT-GDE-001
      See id-registry.md for type codes and current sequence numbers.

  - name: Content Type
    notion_type: select
    required: true
    description: The format or type of this content piece.
    allowed_values:
      - guide
      - faq
      - checklist
      - comparison
      - partner-page
      - service-page
      - email-sequence
      - social-post
      - video-script
      - lead-magnet
      - landing-page
      - blog-post
    taxonomy_ref: TAX-CNT-001

  - name: Status
    notion_type: select
    required: true
    description: Current stage of this content piece in the production pipeline.
    allowed_values:
      - idea
      - briefed
      - in-progress
      - in-review
      - approved
      - scheduled
      - published
      - needs-update
      - archived

  - name: Target Keyword
    notion_type: rich_text
    required: false
    description: Primary keyword or search phrase this content is optimised for.

  - name: Search Intent
    notion_type: select
    required: false
    description: The underlying search intent this content satisfies.
    allowed_values:
      - informational
      - navigational
      - commercial
      - transactional

  - name: Target ICP
    notion_type: multi_select
    required: false
    description: ICP segments this content is primarily written for.
    allowed_values:
      - eu-national
      - uk-national
      - third-country
      - digital-nomad
      - retiree
      - family
      - business-owner
      - property-buyer
      - multi-step-relocator
    taxonomy_ref: TAX-ICP-001

  - name: Category
    notion_type: multi_select
    required: false
    description: Process or topic area(s) this content covers.
    allowed_values:
      - immigration
      - tax
      - property
      - business
      - healthcare
      - transport
      - shipping
      - insurance
      - settling-in
    taxonomy_ref: TAX-TAG-001

  - name: Tags
    notion_type: multi_select
    required: false
    description: Canonical tags from the tag registry for filtering and cross-referencing.
    taxonomy_ref: TAX-TAG-001

  - name: Assigned To
    notion_type: person
    required: false
    description: Team member or agent responsible for producing this content.

  - name: Due Date
    notion_type: date
    required: false
    description: Target completion date for the current stage of production.

  - name: Published Date
    notion_type: date
    required: false
    description: Date this content was published. Populated when status is set to "published".

  - name: Next Review Date
    notion_type: date
    required: false
    description: >
      Date this content is next due for a review and accuracy check.
      Evergreen content: annual. Volatile content (fees, policy): quarterly.

  - name: Word Count
    notion_type: number
    required: false
    description: Approximate or final word count of the content piece.

  - name: Published URL
    notion_type: url
    required: false
    description: Live URL of the published content. Populated once content goes live.

  - name: Related Processes
    notion_type: relation
    required: false
    description: Process documents this content draws from or links to.
    relation_target: Processes Database

  - name: Related Partners
    notion_type: relation
    required: false
    description: Partners referenced or featured in this content piece.
    relation_target: Partners Database

  - name: Related ICPs
    notion_type: relation
    required: false
    description: ICP segments this content piece is written for.
    relation_target: ICPs Database

  - name: Source Knowledge
    notion_type: relation
    required: false
    description: Knowledge articles used as the factual basis for this content.
    relation_target: Knowledge Base Database

  - name: Brief File
    notion_type: url
    required: false
    description: Link to the content brief file in the GitHub repository.

  - name: Content File
    notion_type: url
    required: false
    description: Link to the draft or final content file in the GitHub repository or Google Drive.

  - name: SEO Notes
    notion_type: rich_text
    required: false
    description: >
      Key SEO metadata: title tag, meta description, schema type, and internal linking plan.

  - name: CTA
    notion_type: rich_text
    required: false
    description: The primary call to action used in this content piece.

  - name: Notes
    notion_type: rich_text
    required: false
    description: Free-text field for editorial notes, feedback, blockers, or flags.

  - name: Created
    notion_type: created_time
    required: true
    description: Auto-populated by Notion on record creation.

  - name: Updated
    notion_type: last_edited_time
    required: true
    description: Auto-populated by Notion on each edit.

rules:
  - "Content ID format: CNT-[TYPE CODE]-[NNN]. Assign from id-registry.md CNT sequence."
  - "Content Type must match a value in TAX-CNT-001."
  - "Target ICP values must match TAX-ICP-001 exactly (kebab-case)."
  - "Tags must be drawn from TAX-TAG-001 only."
  - "Published URL and Published Date must both be populated when Status = published."
