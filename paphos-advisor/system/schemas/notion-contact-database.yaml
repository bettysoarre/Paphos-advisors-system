---
id: SCH-NOT-001
title: "Contacts Database — Notion Schema"
database_name: Contacts
notion_database_id: TBD
schema_version: 1
status: draft
created: 2026-04-14
updated: 2026-04-14
owner: "lead-advisor"
related_taxonomies:
  - TAX-ICP-001  # ICP Segments
  - TAX-TAG-001  # Tag Registry
---

description: >
  Client and prospect records. Central hub linking to cases, referrals,
  and content insights. Each contact links to their cases, the ICP segment
  they belong to, and any referrals made on their behalf.

fields:

  - name: Full Name
    notion_type: title
    required: true
    description: Client's full name.

  - name: Contact ID
    notion_type: rich_text
    required: true
    description: Unique ID. Format — CLT-[NNN] (e.g. CLT-001)

  - name: Status
    notion_type: select
    required: true
    allowed_values:
      - prospect
      - active-client
      - past-client
      - on-hold
      - not-a-fit

  - name: ICP Segment
    notion_type: select
    required: false
    description: Which ICP segment best describes this client.
    allowed_values:
      - uk-national
      - eu-national
      - non-eu-digital-nomad
      - entrepreneur-company-formation
      - hni-permanent-residency
      - family-relocating-with-children
    taxonomy_ref: TAX-ICP-001

  - name: Nationality
    notion_type: select
    required: false
    description: Client's nationality category (for process routing).
    allowed_values:
      - eu-eea-national
      - uk-national-post-brexit
      - non-eu-national

  - name: Email
    notion_type: email
    required: true

  - name: Phone
    notion_type: phone_number
    required: false

  - name: Current Location
    notion_type: rich_text
    required: false
    description: Where the client is currently based (country/city).

  - name: Target Move Date
    notion_type: date
    required: false
    description: When the client intends to relocate to Cyprus.

  - name: Cases
    notion_type: relation
    required: false
    description: All cases linked to this client.
    relation_target: Cases Database

  - name: How They Found Us
    notion_type: select
    required: false
    allowed_values:
      - organic-search
      - referral-partner
      - referral-client
      - social-media
      - direct-word-of-mouth
      - other

  - name: Referral Partner
    notion_type: relation
    required: false
    description: If referred by a partner — which partner.
    relation_target: Partners Database

  - name: First Contact Date
    notion_type: date
    required: true

  - name: GDPR Consent
    notion_type: checkbox
    required: true
    description: Client has given consent to store and process their personal data.

  - name: Newsletter Opt-In
    notion_type: checkbox
    required: false
    description: Client has opted in to receive newsletter / content emails.

  - name: Primary Need
    notion_type: multi_select
    required: false
    description: The main reasons for their relocation / what they need help with.
    allowed_values:
      - immigration-residency
      - tax-residency
      - non-dom-status
      - property-purchase
      - property-rental
      - business-formation
      - gesy-healthcare
      - settling-in

  - name: Budget Range
    notion_type: select
    required: false
    allowed_values:
      - under-1000
      - 1000-3000
      - 3000-10000
      - 10000-plus
      - unknown

  - name: Notes
    notion_type: rich_text
    required: false
    description: Key context about this client. Not for case-specific notes (use the Case record).

  - name: Assigned Advisor
    notion_type: person
    required: false
    description: Primary team member managing this client relationship.

rules:
  - "GDPR Consent must be checked before any data is stored. No exceptions."
  - "Contact ID format: CLT-[NNN]. Assign from id-registry.md CLT sequence."
  - "ICP Segment values must match TAX-ICP-001 exactly (kebab-case)."
  - "Status values are kebab-case — align with operational definitions in process-status docs."
