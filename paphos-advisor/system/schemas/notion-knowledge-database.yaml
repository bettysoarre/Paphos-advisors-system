---
id: SCH-NOT-006
title: "Knowledge Base Database — Notion Schema"
database_name: Knowledge Base
notion_database_id: TBD
schema_version: 1
status: draft
created: 2026-04-14
updated: 2026-04-14
owner: "lead-advisor"
related_taxonomies:
  - TAX-CONF-001  # Confidence Levels
  - TAX-SRC-001   # Source Types
  - TAX-TAG-001   # Tag Registry
---

description: >
  Registry and operational view of all knowledge articles. The canonical content
  lives in GitHub (knowledge/ folder); this database provides the operational interface
  for tracking status, confidence, and review cadence.

fields:

  - name: Title
    notion_type: title
    required: true
    description: Descriptive title of the knowledge article. Should be a clear factual claim or topic.

  - name: KB ID
    notion_type: rich_text
    required: true
    description: Unique ID. Format — KA-[TYPE]-[NNN] (e.g. KA-OFF-001, KA-FLD-001)

  - name: Status
    notion_type: select
    required: true
    allowed_values:
      - draft
      - review
      - validated
      - needs-revalidation
      - archived
    taxonomy_ref: TAX-PROC-001

  - name: Knowledge Type
    notion_type: select
    required: true
    allowed_values:
      - official
      - field
      - faq
      - decision-tree

  - name: Topic Area
    notion_type: select
    required: false
    allowed_values:
      - immigration
      - tax
      - property
      - business-formation
      - healthcare
      - transport
      - shipping
      - insurance
      - settling-in

  - name: Confidence
    notion_type: select
    required: true
    allowed_values:
      - high
      - medium
      - low
      - unverified
    taxonomy_ref: TAX-CONF-001

  - name: Source Type
    notion_type: select
    required: false
    allowed_values:
      - official
      - field
      - mixed
    taxonomy_ref: TAX-SRC-001

  - name: Related Process Docs
    notion_type: relation
    required: false
    description: Which process documents this KB article supports.
    relation_target: Processes Database

  - name: Partner Source
    notion_type: relation
    required: false
    description: If field source — which partner provided the knowledge.
    relation_target: Partners Database

  - name: GitHub File Path
    notion_type: rich_text
    required: true
    description: Path to the source .md file in the GitHub repository.

  - name: Date Created
    notion_type: date
    required: true

  - name: Last Reviewed
    notion_type: date
    required: false
    description: Date of last accuracy review.

  - name: Next Review Due
    notion_type: date
    required: false
    description: >
      Calculated from review cadence.
      High confidence = 12 months; medium = 6 months; low = 3 months.

  - name: Used In Content
    notion_type: checkbox
    required: false
    description: Has this KB article been used as a source for published content?

  - name: Tags
    notion_type: multi_select
    required: false
    description: Canonical tags from tag-registry.yaml.
    taxonomy_ref: TAX-TAG-001

rules:
  - "KB ID format: KA-[TYPE]-[NNN] where TYPE is OFF (official), FLD (field), or FAQ."
  - "GitHub File Path must be populated for all validated articles."
  - "Confidence must be set before Status can move to 'validated'."
  - "Next Review Due must be set when Status = validated."
