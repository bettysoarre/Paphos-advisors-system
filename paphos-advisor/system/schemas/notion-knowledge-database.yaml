# Notion Knowledge Base Database Schema
# Database: Knowledge Base (PA - Knowledge workspace)
# Purpose: Registry of all KB articles, linking to their GitHub source files.

database_name: Knowledge Base
description: Registry and operational view of all knowledge articles. The canonical content lives in GitHub (knowledge/ folder); this database provides the operational interface.

properties:
  - name: Title
    type: title
    description: Descriptive title of the knowledge article. Should be a clear factual claim or topic.
    required: true

  - name: KB ID
    type: rich_text
    description: Unique ID. Format — KB-[TYPE]-[NNN] (e.g. KB-OFF-001, KB-FLD-001)
    required: true

  - name: Status
    type: select
    options:
      - name: Draft
        color: gray
        description: Article created but not yet reviewed.
      - name: Review
        color: yellow
        description: Under review for accuracy and completeness.
      - name: Validated
        color: green
        description: Reviewed and approved. Safe to reference in content and advice.
      - name: Needs Revalidation
        color: orange
        description: Previously validated but circumstances have changed.
      - name: Archived
        color: red
        description: No longer current. Kept for historical reference.

  - name: Knowledge Type
    type: select
    options:
      - name: Official
        description: Summarises official government guidance.
      - name: Field
        description: Practical intelligence from partner interviews or field observation.
      - name: FAQ
        description: Canonical answer to a frequently asked question.
      - name: Decision Tree
        description: Logic tree for routing a client to the right process or answer.

  - name: Topic Area
    type: select
    options:
      - Immigration
      - Tax
      - Property
      - Business Formation
      - Healthcare
      - Transport
      - Shipping
      - Insurance
      - Settling In

  - name: Confidence
    type: select
    options:
      - name: High
        color: green
      - name: Medium
        color: yellow
      - name: Low
        color: orange
      - name: Unverified
        color: red
    required: true

  - name: Source Type
    type: select
    options:
      - Official
      - Field
      - Mixed

  - name: Related Process Docs
    type: relation
    relation_database: Process Library
    description: Which process documents this KB article supports.

  - name: Partner Source
    type: relation
    relation_database: Partners
    description: If field source — which partner category the knowledge came from.

  - name: GitHub File Path
    type: rich_text
    description: Path to the source .md file in the GitHub repository.

  - name: Date Created
    type: date
    required: true

  - name: Last Reviewed
    type: date
    description: Date of last accuracy review.

  - name: Next Review Due
    type: date
    description: Calculated from review cadence. High confidence = 12 months; medium = 6 months; low = 3 months.

  - name: Used In Content
    type: checkbox
    description: Has this KB article been used as a source for published content?

  - name: Tags
    type: multi_select
    description: Canonical tags from tag-registry.yaml.
