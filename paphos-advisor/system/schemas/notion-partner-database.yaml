---
id: SCH-NOT-002
title: "Partners Database — Notion Schema"
database_name: Partners
notion_database_id: 47ff4231-f41b-43aa-91be-70f6d872d3f0
schema_version: 1
status: active
created: 2026-04-13
updated: 2026-04-13
owner: "lead-advisor"
related_taxonomies:
  - TAX-PART-001  # Partner Categories
  - TAX-SVC-001  # Service Types
  - TAX-TAG-001  # Tag Registry
---

description: >
  Master database of all partners in the Paphos Advisor referral network.
  Each record represents one partner entity (individual or company).

fields:

  - name: Partner Name
    notion_type: title
    required: true
    description: Full legal name of the partner individual or company.
    notes: >
      Field exists in Notion as "Partner Name" (title field).
      Schema spec uses "Name" — same field, different label.

  - name: Partner ID
    notion_type: rich_text
    required: true
    description: >
      Unique identifier for this partner record.
      Format: PRTN-[AREA]-[NNN] (e.g. PRTN-LAW-001).
      Assigned at onboarding; never reused.
    taxonomy_ref: id-registry.md (PRTN prefix)

  - name: Category
    notion_type: select
    required: true
    description: Primary professional category of the partner.
    allowed_values:
      - lawyer
      - accountant
      - government-liaison
      - shipping
      - property-developer
      - property-agent
      - insurance
      - tax-specialist
      - other
    taxonomy_ref: TAX-PART-001

  - name: Services Offered
    notion_type: multi_select
    required: true
    description: Specific services this partner provides. Select all that apply.
    allowed_values:
      - immigration-application
      - company-formation
      - property-conveyancing
      - contract-review
      - legal-representation
      - tax-residency-structuring
      - non-dom-application
      - vat-registration
      - personal-tax-filing
      - corporate-tax-filing
      - bookkeeping
      - audit
      - property-search
      - property-management
      - new-build-sales
      - international-shipping
      - customs-clearance
      - vehicle-import
      - health-insurance
      - vehicle-insurance
      - property-insurance
      - life-insurance
      - document-handling
      - apostille-legalisation
      - translation
    taxonomy_ref: TAX-SVC-001

  - name: Status
    notion_type: select
    required: true
    description: Current status of this partner in the network.
    allowed_values:
      - prospecting
      - in-conversation
      - onboarding
      - active
      - paused
      - inactive
      - blacklisted
    notes: >
      Notion currently has this as "Onboarding Status" (status type).
      Pending manual update: rename to "Status", change type to select, replace values with the list above.

  - name: ICP Fit
    notion_type: multi_select
    required: false
    description: ICP segments this partner's services are most relevant to.
    allowed_values:
      - eu-national
      - uk-national
      - third-country
      - digital-nomad
      - retiree
      - family
      - business-owner
      - property-buyer
      - multi-step-relocator
    taxonomy_ref: TAX-ICP-001

  - name: Geography
    notion_type: multi_select
    required: true
    description: Districts or regions where this partner operates.
    allowed_values:
      - paphos
      - limassol
      - nicosia
      - larnaca
      - famagusta
      - cyprus-wide
    taxonomy_ref: TAX-TAG-001 (geography dimension)

  - name: Languages
    notion_type: multi_select
    required: false
    description: Languages the partner works in.
    allowed_values:
      - english
      - greek
      - russian
      - hebrew
      - german
      - french
      - arabic
      - other

  - name: Contact Name
    notion_type: rich_text
    required: true
    description: Full name of the primary contact person at this partner.

  - name: Contact Email
    notion_type: email
    required: true
    description: Primary email address for the partner contact.

  - name: Contact Phone
    notion_type: phone_number
    required: false
    description: Primary phone number for the partner contact.

  - name: Website
    notion_type: url
    required: false
    description: Partner's official website URL.

  - name: Referral Terms
    notion_type: select
    required: false
    description: Whether a formal referral agreement is in place.
    allowed_values:
      - formal-agreement
      - informal-arrangement
      - none
      - pending

  - name: Referral Eligible
    notion_type: checkbox
    required: false
    description: Whether this partner is currently eligible to receive referrals.

  - name: Commission Rate
    notion_type: number
    required: false
    description: >
      Agreed referral commission percentage (if applicable).
      Store as a percentage value e.g. 10 for 10%.
    format: percent

  - name: Onboarding Date
    notion_type: date
    required: false
    description: Date the partner was formally onboarded to the network.

  - name: Last Contact Date
    notion_type: date
    required: false
    description: Date of the most recent meaningful contact with this partner.

  - name: Last Review Date
    notion_type: date
    required: false
    description: Date this partner record was most recently reviewed.

  - name: Next Review Due
    notion_type: date
    required: false
    description: Date this partner record is next due for review. Default cadence is 3 months.

  - name: Quality Rating
    notion_type: select
    required: false
    description: Internal quality assessment of the partner based on client outcomes and responsiveness.
    allowed_values:
      - excellent
      - good
      - acceptable
      - under-review
      - do-not-refer

  - name: Internal Trust Notes
    notion_type: rich_text
    required: false
    description: >
      Internal vetting notes, relationship history, caveats, and special arrangements.
    notes: >
      Exists in Notion as "Internal Trust Notes". Schema spec used "Vetting Notes" — same purpose,
      no duplicate created. Field label retained as-is.

  - name: Tags
    notion_type: multi_select
    required: false
    description: Process and audience tags for filtering and cross-referencing.
    taxonomy_ref: TAX-TAG-001

  - name: GitHub Profile Path
    notion_type: rich_text
    required: false
    description: >
      Path to this partner's GitHub profile file within the repository.
      Format: partners/[category]/[filename].md
    notes: >
      Exists in Notion as "GitHub Profile Path". Schema spec used "GitHub Category File" — same purpose,
      field label retained as-is.

  - name: Related Processes
    notion_type: relation
    required: false
    description: Processes this partner is relevant to. Linked to the Processes database.
    relation_target: Processes Database

  - name: Active Referrals
    notion_type: rollup
    required: false
    description: Count of active referrals currently assigned to this partner.
    rollup_target: Referrals Database
    rollup_field: Status
    rollup_function: count_values

rules:
  - "Each partner record must have a Partner ID assigned from the PRTN sequence in id-registry.md before activation."
  - "Category must match a value in TAX-PART-001 — use the value field (lowercase), not the label."
  - "Services Offered must match values in TAX-SVC-001 exactly."
  - "Tags must be drawn from TAX-TAG-001 only."
  - "Partner ID format: PRTN-[AREA]-[NNN] where AREA matches the partner category code in id-registry.md."

pending_notion_changes:
  - field: Status
    action: rename_and_retype
    from_name: "Onboarding Status"
    to_name: "Status"
    from_type: status
    to_type: select
    replace_values:
      - Not started → prospecting
      - In progress → in-conversation
      - Onboarded → onboarding
      - Active → active
      - Paused → paused
      - Offboarded → inactive
      add: blacklisted
    note: >
      Notion MCP was disconnected before this change could be applied.
      Apply manually or reconnect MCP and re-run.

resolved_discrepancies:
  - field: Name (title)
    spec_name: "Name"
    notion_name: "Partner Name"
    resolution: accepted
    note: Same field, different label. No action needed.

  - field: Internal notes
    spec_name: "Vetting Notes"
    notion_name: "Internal Trust Notes"
    resolution: accepted
    note: Same purpose, different label. No duplicate created. Notion label retained.

  - field: GitHub file link
    spec_name: "GitHub Category File"
    notion_name: "GitHub Profile Path"
    resolution: accepted
    note: Same purpose, different label. Notion label retained.
