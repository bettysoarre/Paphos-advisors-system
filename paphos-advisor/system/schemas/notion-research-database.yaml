---
id: SCH-NOT-005
title: "Research Log Database — Notion Schema"
database_name: Research Log
notion_database_id: TBD
schema_version: 1
status: draft
created: 2026-04-14
updated: 2026-04-14
owner: "lead-advisor"
related_taxonomies:
  - TAX-SRC-001   # Source Types
  - TAX-CONF-001  # Confidence Levels
---

description: >
  Tracks research sessions — Perplexity deep dives, official source reviews, and field
  observations — and their extracted outputs. Each record is one research session.

fields:

  - name: Session Title
    notion_type: title
    required: true
    description: >
      Descriptive name for the research session.
      e.g. "Yellow Slip MEU1 — Perplexity Deep Research Apr 2026"

  - name: Research ID
    notion_type: rich_text
    required: true
    description: Unique ID. Format — RES-[NNN] (e.g. RES-001)

  - name: Status
    notion_type: select
    required: true
    allowed_values:
      - planned
      - in-progress
      - captured
      - extracting
      - integrated

  - name: Research Type
    notion_type: select
    required: true
    allowed_values:
      - process-research
      - source-discovery
      - regulatory-update-check
      - competitor-content-audit
      - field-observation

  - name: Topic Area
    notion_type: select
    required: false
    allowed_values:
      - immigration
      - tax
      - property
      - business-formation
      - healthcare
      - transport
      - shipping
      - insurance
      - settling-in
      - content-strategy
      - partner-research

  - name: Prompt Used
    notion_type: select
    required: false
    description: Which AI prompt was used to run this research session.
    allowed_values:
      - PRMT-RES-001
      - PRMT-RES-002
      - PRMT-RES-003
      - PRMT-RES-004
      - PRMT-EXT-001
      - PRMT-EXT-002
      - PRMT-EXT-003

  - name: Tool Used
    notion_type: select
    required: false
    allowed_values:
      - perplexity-deep-research
      - claude
      - manual-review
      - other

  - name: Session Date
    notion_type: date
    required: true
    description: Date the research session was run.

  - name: Process Doc Updated
    notion_type: relation
    required: false
    description: Which process document(s) were updated as a result of this research.
    relation_target: Processes Database

  - name: KB Articles Created
    notion_type: number
    required: false
    description: Number of KB articles created from this session.

  - name: Capture File
    notion_type: rich_text
    required: false
    description: Path to the raw output file in assets/research-captures/.

  - name: Confidence Output
    notion_type: select
    required: false
    description: Overall confidence level of the research output.
    allowed_values:
      - high
      - medium
      - low
      - unverified
    taxonomy_ref: TAX-CONF-001

  - name: Open Questions
    notion_type: rich_text
    required: false
    description: Questions that the research raised but did not resolve. These become next research tasks.

  - name: Researcher
    notion_type: person
    required: false
    description: Who ran the research session.

  - name: Notes
    notion_type: rich_text
    required: false
    description: Any additional context about this research session.

rules:
  - "Research ID format: RES-[NNN]. Assign from id-registry.md RES sequence."
  - "Capture File must be populated before Status moves to 'captured'."
  - "Status must reach 'integrated' before research is considered complete."
  - "Prompt Used values must match current PRMT IDs in id-registry.md."
