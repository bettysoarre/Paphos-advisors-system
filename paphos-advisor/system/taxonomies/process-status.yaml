taxonomy:
  name: process-status
  description: >
    Tracks the lifecycle stage of a process document within the Paphos Advisor system.
    Every process file must carry one of these statuses.

values:
  - id: stub
    label: Stub
    definition: >
      Placeholder file created to reserve the topic. Contains no substantive content yet.

  - id: draft
    label: Draft
    definition: >
      Initial content has been written but has not been researched or verified.
      Not suitable for use in client-facing work.

  - id: in-research
    label: In Research
    definition: >
      Actively being researched. Sources are being gathered and facts are being checked.
      Content is incomplete and subject to significant change.

  - id: review
    label: Review
    definition: >
      Research is complete and content is ready for internal expert review before validation.

  - id: validated
    label: Validated
    definition: >
      Content has been reviewed and confirmed accurate by a qualified internal or external expert.
      Safe to use in client-facing and content work.

  - id: published
    label: Published
    definition: >
      Validated content that has been released for active use across the system and/or publicly.

  - id: needs-revalidation
    label: Needs Revalidation
    definition: >
      Previously validated or published content flagged as potentially outdated due to
      regulatory changes, new field information, or scheduled review triggers.

  - id: deprecated
    label: Deprecated
    definition: >
      Content that is no longer accurate or relevant. Retained for reference but must not
      be used in active work or shared with clients.

  - id: archived
    label: Archived
    definition: >
      Content that has been formally retired from the system. Stored in _archive for
      historical reference only.
