dimensions:

  # -----------------------------------------------------------------------
  # PROCESS — tags relating to the advisory and administrative process areas
  # -----------------------------------------------------------------------
  process:
    description: Tags that identify the process domain a piece of content or knowledge relates to.
    values:
      - tag: immigration
        description: Relates to visa applications, residence permits, work permits, or entry to Cyprus.

      - tag: tax
        description: Relates to personal or corporate tax, tax residency, VAT, or non-dom status.

      - tag: property
        description: Relates to buying, selling, renting, or managing property in Cyprus.

      - tag: business-setup
        description: Relates to company formation, registration, or operating a business in Cyprus.

      - tag: banking
        description: Relates to opening bank accounts, financial access, or banking services in Cyprus.

      - tag: healthcare
        description: Relates to registering with healthcare providers, GESY, or accessing medical services.

      - tag: transport
        description: Relates to vehicle import, driving licences, or road transport in Cyprus.

      - tag: shipping
        description: Relates to international shipping, customs clearance, or import logistics.

      - tag: insurance
        description: Relates to health, vehicle, property, or life insurance in Cyprus.

      - tag: settling-in
        description: Relates to practical day-to-day settling-in tasks such as utilities, schools, and local registration.

      - tag: lifestyle
        description: Relates to quality of life, cost of living, areas, schools, community, and day-to-day life in Cyprus.

      - tag: legal
        description: Relates to legal processes, contracts, representation, or regulatory compliance.

      - tag: compliance
        description: Relates to ongoing compliance obligations for individuals or businesses in Cyprus.

  # -----------------------------------------------------------------------
  # SERVICE — tags relating to specific Paphos Advisor or partner services
  # -----------------------------------------------------------------------
  service:
    description: Tags that identify a specific service type relevant to the content or knowledge entry.
    values:
      - tag: residence-permit
        description: Relates specifically to the residence permit application process.

      - tag: work-permit
        description: Relates specifically to work permit applications and requirements.

      - tag: digital-nomad-visa
        description: Relates to the Cyprus Digital Nomad Visa specifically.

      - tag: non-dom
        description: Relates to the non-domicile tax status application or its implications.

      - tag: company-formation
        description: Relates to the formation and registration of a Cypriot company.

      - tag: conveyancing
        description: Relates to the legal process of transferring property ownership.

      - tag: title-deeds
        description: Relates to the issuance, transfer, or verification of property title deeds.

      - tag: customs
        description: Relates to customs duties, declarations, or clearance procedures.

      - tag: gesy
        description: Relates to the General Healthcare System (GESY) registration or coverage.

      - tag: apostille
        description: Relates to apostille stamping or document legalisation.

      - tag: translation
        description: Relates to certified or general translation of documents.

  # -----------------------------------------------------------------------
  # GEOGRAPHY — tags relating to location within or outside Cyprus
  # -----------------------------------------------------------------------
  geography:
    description: Tags that identify a geographic area relevant to the content or process.
    values:
      - tag: paphos
        description: Relates specifically to the Paphos district of Cyprus.

      - tag: limassol
        description: Relates specifically to the Limassol district of Cyprus.

      - tag: nicosia
        description: Relates specifically to the Nicosia district and capital region of Cyprus.

      - tag: larnaca
        description: Relates specifically to the Larnaca district of Cyprus.

      - tag: famagusta
        description: Relates specifically to the Famagusta district of Cyprus.

      - tag: cyprus-wide
        description: Applies across all districts of Cyprus with no geographic restriction.

      - tag: eu
        description: Relates to European Union rules, regulations, or cross-border considerations.

      - tag: uk
        description: Relates to the United Kingdom specifically, including post-Brexit rules.

      - tag: international
        description: Relates to cross-border or non-Cyprus-specific international considerations.

  # -----------------------------------------------------------------------
  # AUDIENCE — tags relating to the target reader or client segment
  # -----------------------------------------------------------------------
  audience:
    description: Tags that identify which ICP segment or reader type the content is primarily aimed at.
    values:
      - tag: eu-nationals
        description: Content primarily relevant to EU citizens relocating to Cyprus.

      - tag: uk-nationals
        description: Content primarily relevant to British citizens relocating to Cyprus post-Brexit.

      - tag: third-country-nationals
        description: Content primarily relevant to non-EU, non-UK nationals relocating to Cyprus.

      - tag: digital-nomads
        description: Content primarily relevant to location-independent remote workers.

      - tag: retirees
        description: Content primarily relevant to individuals relocating to Cyprus in retirement.

      - tag: families
        description: Content primarily relevant to families relocating together.

      - tag: business-owners
        description: Content primarily relevant to entrepreneurs and business owners.

      - tag: property-buyers
        description: Content primarily relevant to individuals purchasing property in Cyprus.

      - tag: multi-step-relocators
        description: Content relevant to clients managing multiple complex processes simultaneously.

      - tag: advisors
        description: Internal content intended for use by the Paphos Advisors team, not clients.

rules:
  - "Tags must be applied from this registry only — do not invent ad-hoc tags."
  - "Each record should carry at least one process tag and one audience tag where applicable."
  - "Geography tags are optional but recommended for district-specific content."
  - "The 'advisors' audience tag must be applied to all internal-only content."
