taxonomy:
  name: partner-categories
  description: >
    Defines the professional categories used to classify partners in the Paphos Advisor
    partner network. Each partner is assigned one primary category.

values:
  - id: lawyer
    label: Lawyer
    definition: >
      Licensed legal professionals providing services such as immigration applications,
      company formation, property conveyancing, contract review, and legal representation.

  - id: accountant
    label: Accountant
    definition: >
      Qualified accountants and accounting firms providing bookkeeping, financial reporting,
      audit, and general accounting services for individuals and businesses in Cyprus.

  - id: government-liaison
    label: Government Liaison
    definition: >
      Specialists who manage interactions with Cypriot government departments on behalf of
      clients. Includes document runners, application handlers, and officials familiar
      with navigating bureaucratic processes efficiently.

  - id: shipping
    label: Shipping
    definition: >
      Companies and agents providing international shipping, freight forwarding, customs
      clearance, and logistics services for personal effects, vehicles, and commercial goods.

  - id: property-developer
    label: Property Developer
    definition: >
      Companies that develop and sell new-build residential or commercial properties
      in Cyprus. Includes off-plan and newly completed developments.

  - id: property-agent
    label: Property Agent
    definition: >
      Licensed real estate agents assisting clients with buying, selling, or renting
      residential and commercial properties in Cyprus.

  - id: insurance
    label: Insurance
    definition: >
      Insurance brokers and providers offering health, life, vehicle, property, and
      liability insurance products relevant to relocators and residents in Cyprus.

  - id: tax-specialist
    label: Tax Specialist
    definition: >
      Professionals specialising in Cypriot and international tax advisory, including
      tax residency structuring, VAT registration, non-dom applications, and cross-border
      tax planning.

  - id: other
    label: Other
    definition: >
      Partners who provide services relevant to the relocating community but do not fit
      cleanly into the above categories. Includes translators, school advisors, healthcare
      providers, banking facilitators, and lifestyle services.
