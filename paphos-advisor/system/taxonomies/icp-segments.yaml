values:
  - value: eu-national
    label: "EU National"
    description: >
      Citizens of European Union member states (excluding Cyprus) relocating to Cyprus.
      Benefit from freedom of movement rights and face a simpler registration process
      than third-country nationals, but still require guidance on MEU1 registration,
      tax residency, and settling-in practicalities.
    segment_ref: ICP-SEG-002

  - value: uk-national
    label: "UK National"
    description: >
      British citizens relocating to Cyprus post-Brexit. No longer covered by EU freedom
      of movement and require a specific immigration route (Category F or work permit).
      A high-volume segment with distinct legal and tax considerations.
    segment_ref: ICP-SEG-001

  - value: third-country
    label: "Third-Country National"
    description: >
      Citizens of non-EU, non-UK countries relocating to Cyprus. Subject to the most
      complex immigration requirements including work permits, residence permits, and
      sponsorship rules. Includes Americans, Canadians, Israelis, South Africans, and others.
    segment_ref: ICP-SEG-003

  - value: digital-nomad
    label: "Digital Nomad"
    description: >
      Location-independent workers or freelancers relocating to Cyprus to live and work
      remotely for non-Cypriot clients or employers. May pursue the Digital Nomad Visa
      or alternative residency routes depending on nationality and income structure.
    segment_ref: ICP-SEG-003

  - value: retiree
    label: "Retiree"
    description: >
      Individuals relocating to Cyprus in retirement, primarily motivated by lifestyle,
      climate, cost of living, and tax efficiency. Often interested in the Category F
      (financially independent person) permit and pension tax treatment.
    segment_ref: ICP-SEG-001

  - value: family
    label: "Family"
    description: >
      Families relocating together, including couples with children. Have additional
      needs around schooling, healthcare, family permit applications, and family-oriented
      settling-in services.
    segment_ref: ICP-SEG-006

  - value: business-owner
    label: "Business Owner"
    description: >
      Entrepreneurs and business owners relocating to Cyprus to establish or relocate
      a business entity, take advantage of Cyprus's corporate tax environment, or
      operate as a self-employed professional. Interested in company formation, non-dom
      status, and tax structuring.
    segment_ref: ICP-SEG-004

  - value: property-buyer
    label: "Property Buyer"
    description: >
      Individuals or families purchasing property in Cyprus, whether as a primary
      residence, holiday home, or investment. May or may not be relocating permanently.
      Have specific needs around conveyancing, title deeds, mortgage access, and
      property management.
    segment_ref: ICP-SEG-007

  - value: hni
    label: "HNI — Permanent Residency"
    description: >
      High net worth individuals seeking Cyprus permanent residency through the
      Category 6.2 investment route. Typically non-EU nationals. Highest individual
      case value segment.
    segment_ref: ICP-SEG-005

  - value: multi-step-relocator
    label: "Multi-Step Relocator"
    description: >
      Clients navigating multiple complex, interconnected processes simultaneously —
      such as immigration, business setup, property purchase, and tax residency.
      Require coordinated advisory across several service areas and are the highest
      value segment for Paphos Advisors.

  - value: related-partners
    label: "Related Partners"
    description: >
      Cyprus-based professionals (lawyers, accountants, property agents, relocation fixers)
      or established locally resident expats who interact with Paphos Advisors as referral
      sources, co-advisors, or influence nodes — not as direct end-clients. This is a B2B
      stakeholder category, not a front-end marketing ICP.
    segment_ref: ICP-SEG-008

  - value: low-budget-aspirational
    label: "Low Budget Aspirational"
    description: >
      Individuals dreaming of moving to Cyprus whose budget, income, or intent does not
      match the core Paphos Advisors commercial model. Includes seasonal workers, retirees
      below the Category F income threshold, and people planning short-term stays rather
      than genuine long-term relocation. High content engagement, low direct advisory value.
    segment_ref: ICP-SEG-009

rules:
  - "A client may be assigned multiple segment values simultaneously."
  - "Where a detailed ICP-SEG file exists, the segment_ref field links to it as the canonical definition."
  - "Taxonomy values must be referenced in frontmatter and content briefs as kebab-case lowercase."
  - "ICP-SEG-008 (Related Partners) is a B2B stakeholder category — do not apply to front-end marketing ICPs or content targeting."
