values:
  # --- Legal Services ---
  - value: immigration-application
    label: "Immigration Application"
    description: >
      Preparation and submission of residence permit, work permit, and visa applications
      on behalf of the client.

  - value: company-formation
    label: "Company Formation"
    description: >
      Incorporation of a Cypriot limited company or other legal entity, including
      registration with the Registrar of Companies.

  - value: property-conveyancing
    label: "Property Conveyancing"
    description: >
      Legal handling of property purchase transactions, including title deed transfer,
      contract review, and Land Registry registration.

  - value: contract-review
    label: "Contract Review"
    description: >
      Review and advice on legal contracts, including employment contracts, lease
      agreements, service agreements, and supplier contracts.

  - value: legal-representation
    label: "Legal Representation"
    description: >
      Representation of clients in legal proceedings, disputes, or negotiations
      with third parties or government bodies.

  # --- Tax & Accounting Services ---
  - value: tax-residency-structuring
    label: "Tax Residency Structuring"
    description: >
      Advisory on establishing Cyprus tax residency, including the 60-day rule,
      non-dom status, and worldwide income structuring.

  - value: non-dom-application
    label: "Non-Dom Application"
    description: >
      Application for Cyprus non-domicile status, which exempts qualifying individuals
      from Special Defence Contribution (SDC) on dividends and interest.

  - value: vat-registration
    label: "VAT Registration"
    description: >
      Registration of individuals or businesses for VAT in Cyprus, including
      intra-EU VAT considerations.

  - value: personal-tax-filing
    label: "Personal Tax Filing"
    description: >
      Preparation and submission of personal income tax returns in Cyprus.

  - value: corporate-tax-filing
    label: "Corporate Tax Filing"
    description: >
      Preparation and submission of corporate tax returns for Cypriot entities.

  - value: bookkeeping
    label: "Bookkeeping"
    description: >
      Ongoing recording and reconciliation of financial transactions for businesses
      or self-employed individuals.

  - value: audit
    label: "Audit"
    description: >
      Statutory or voluntary audit of financial statements for Cypriot companies.

  # --- Property Services ---
  - value: property-search
    label: "Property Search"
    description: >
      Sourcing and presenting properties for sale or rent based on client requirements.

  - value: property-management
    label: "Property Management"
    description: >
      Ongoing management of a property on behalf of an owner, including tenant
      management, maintenance, and rental income collection.

  - value: new-build-sales
    label: "New-Build Sales"
    description: >
      Sale of off-plan or newly completed residential or commercial developments.

  # --- Shipping & Logistics ---
  - value: international-shipping
    label: "International Shipping"
    description: >
      Transportation of personal effects, furniture, or goods from another country to Cyprus.

  - value: customs-clearance
    label: "Customs Clearance"
    description: >
      Processing of customs documentation and duties for goods entering Cyprus.

  - value: vehicle-import
    label: "Vehicle Import"
    description: >
      Logistics and paperwork for importing a personal vehicle into Cyprus,
      including customs and re-registration support.

  # --- Insurance Services ---
  - value: health-insurance
    label: "Health Insurance"
    description: >
      Private health insurance plans for individuals, families, and employees in Cyprus.

  - value: vehicle-insurance
    label: "Vehicle Insurance"
    description: >
      Motor insurance for vehicles registered or operating in Cyprus.

  - value: property-insurance
    label: "Property Insurance"
    description: >
      Buildings and contents insurance for residential or commercial properties in Cyprus.

  - value: life-insurance
    label: "Life Insurance"
    description: >
      Life and critical illness insurance products for individuals and families.

  # --- Government Liaison Services ---
  - value: document-handling
    label: "Document Handling"
    description: >
      Physical submission, collection, and tracking of applications and documents
      at government offices on behalf of clients.

  - value: apostille-legalisation
    label: "Apostille & Legalisation"
    description: >
      Processing of apostille stamps and document legalisation for use in Cyprus
      or abroad.

  - value: translation
    label: "Translation"
    description: >
      Certified or general translation of documents between English, Greek, and other languages.
