states:
  - id: idea
    label: Idea
    description: Content topic identified, brief not yet created.
    next_states: [brief]

  - id: brief
    label: Brief
    description: Content brief created in Notion. Pending writer assignment.
    next_states: [in-production, blocked]

  - id: in-production
    label: In Production
    description: Writer actively working on the draft.
    next_states: [review]

  - id: review
    label: Review
    description: Draft submitted for editorial review.
    next_states: [approved, in-production]

  - id: approved
    label: Approved
    description: Review passed. Ready to publish.
    next_states: [published]

  - id: published
    label: Published
    description: Live on website. Monitoring for updates.
    next_states: [needs-update, archived]

  - id: needs-update
    label: Needs Update
    description: Published content flagged for update.
    next_states: [in-production, published, archived]

  - id: blocked
    label: Blocked
    description: Item cannot progress — source material not ready, keyword research pending, or writer unavailable.
    next_states: [brief]

  - id: archived
    label: Archived
    description: Content retired. No longer live.
    next_states: []

transitions:
  - from: idea
    to: brief
    trigger: Content lead decides to progress
    actor: Content lead

  - from: brief
    to: in-production
    trigger: Writer assigned and due date confirmed
    actor: Content lead

  - from: in-production
    to: review
    trigger: Writer completes draft per SOP-CON-001
    actor: Writer

  - from: review
    to: approved
    trigger: Review passes per SOP-CON-002
    actor: Reviewer

  - from: review
    to: in-production
    trigger: Review returns draft for revision
    actor: Reviewer

  - from: approved
    to: published
    trigger: Publisher goes live per SOP-CON-003
    actor: Publisher

  - from: published
    to: needs-update
    trigger: Scheduled review date, regulatory change, or quality flag
    actor: Automated cadence or team flag

  - from: needs-update
    to: in-production
    trigger: Major update required
    actor: Content lead

  - from: needs-update
    to: published
    trigger: Minor update made directly
    actor: Publisher

  - from: published
    to: archived
    trigger: Content retired per SOP-CON-004
    actor: Content lead
